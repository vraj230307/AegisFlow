name: AegisFlow CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest

    - name: Run Component 2 Unit Tests
      run: |
        python backend/test_component2_nodes.py

    - name: Run Component 3 Orchestrator & Fallback Tests
      run: |
        python backend/test_component3_orchestrator.py

    - name: Run 5x Stage Demo Rehearsal Test
      run: |
        python backend/test_rehearsal_5x.py

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Frontend Bundle
      run: |
        cd frontend
        npm run build
